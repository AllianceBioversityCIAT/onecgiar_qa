# OneCGIAR QA DEV: CI on GitHub Actions, CD on Jenkins (CD-only job qa-application-2026-dev-cd).
# Same model as Reporting Tool DEV (onecgiar_pr reporting-tool-dev-cicd.yml).
#
#   GitHub Actions (CI)  ->  qa-application-2026-dev-cd (Jenkins, CD orchestration)  ->  TEST server
#
# The legacy all-in-one job qa-application-2026-dev (devops PIPES/PRMS/V2/QA-2026/dev-complete/Jenkinsfile) is NOT
# used by this workflow; jenkins-trigger.yml no longer starts it on push to dev (cutover). It stays available for
# manual recovery (workflow_dispatch of jenkins-trigger.yml from dev, or Jenkins).
# `dry-run` of the Jenkins hand-over (job `deploy` below) is false: qa-application-2026-dev-cd deploys the three
# digests to the TEST server (it also needs REAL_DEPLOY_AUTHORIZED = true in the Jenkinsfile). true = the job only
# validates the request, the ECR images and the server over SSH WITHOUT changing anything.
#
# Triggers: push to dev only, and workflow_dispatch (manual; GitHub offers it only once the workflow file is on the
# default branch). Both run the full CI/CD:
#   the checks of the legacy job (server lint and tests, client tests), then ONE publish job (common quality
#   barrier: it starts only when every check passed) that builds the three images of the legacy job (server API,
#   server `migrate`, client) and pushes them to ECR by immutable digest, then the hand-over to Jenkins with the
#   three digests, the commit and this run (reusable workflow jenkins-cd.reusable.yml). Jenkins runs the legacy
#   deploy steps on the server (env file, drizzle migrations, container swap, health waits) and reports the result.
#   It never lints, tests, builds or pushes images.
# There is no pull_request trigger: the client checks need the DEV frontend configuration, which is never given to
# pull request code.
#
# Slack (reusable workflow slack-notify.reusable.yml; one message per event, never duplicated):
#   started               GitHub Actions, at the start of the run (the whole CI/CD process)
#   failed                GitHub Actions, only when the run fails before Jenkins started the deploy build
#   succeeded / failed    Jenkins, for the deploy (post block of the CD job)
#
# GitHub Environments:
#   qa-dev-ci   CI jobs that need AWS (frontend configuration read, ECR push). No required reviewers (it runs on
#               every push); deployment branches: dev only.
#               Variables: CICD_BOUND_REF, QA_AWS_REGION, QA_ECR_SERVER_REPOSITORY, QA_ECR_CLIENT_REPOSITORY.
#               Secrets: QA_BUILD_ROLE_ARN, QA_FRONTEND_CONFIG_SECRET_ID. They are identifiers, not credentials;
#               they are secrets only so GitHub masks them in these public logs.
#   qa-dev      Jenkins hand-over only. No required reviewers; deployment branches: dev only. Uses
#               JENKINS_USERNAME and JENKINS_API_TOKEN, the same secrets as jenkins-trigger.yml.
#   The build role trusts only `qa-dev-ci` and the ref refs/heads/dev. CICD_BOUND_REF (qa-dev-ci) is refs/heads/dev.
#   Slack: organization secret SLACK_NOTIFICATIONS_WEBHOOK_URL (incoming webhook of #notifications-platform).
#   Without it the notifications are skipped with a warning; they never block the pipeline.
#
# Secret handling (only the frontend configuration, as in the Jenkins job; the server needs no secret in CI, its
# runtime configuration is still written by Jenkins on the server):
#   * OIDC with `output-env-credentials: false`: credentials are never exported to the job; only the
#     secret-read step and the push step receive them, through their own `env:`.
#   * `npm ci` runs before the configuration is written, and the server images are built before it too.
#   * npm, tests and docker builds that run with the configuration go through .github/scripts/without-oidc.sh: no
#     AWS credential and no OIDC request variable, so no code they run can obtain a token.
#   * The AWS CLI writes the secret straight to the environment files (mode 0600); its string values are also
#     registered as log masks (defense in depth, not the protection itself). Never echoed, never an output, never
#     uploaded, never cached; the files and the Angular cache are removed by `if: always()` steps. No `set -x`.
#
# Action pinning: every `uses:` is a full commit SHA (same SHAs as the Reporting Tool DEV pipeline):
#   actions/checkout                       v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node                     v7.0.0  820762786026740c76f36085b0efc47a31fe5020
#   aws-actions/configure-aws-credentials  v6.3.0  e1253824e5c10ff9df46874f81ed3ec929e19cfd
# The local reusable workflows (./.github/workflows/*.reusable.yml) run from this same commit.
name: qa-dev-cicd

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: qa-dev-cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  # ---------------------------------------------------------------- start notification
  # Runs in parallel with the checks and never blocks them.
  notify-start:
    name: notify start (Slack)
    permissions: {}
    uses: ./.github/workflows/slack-notify.reusable.yml
    with:
      status: started
      title: OneCGIAR QA NEW ENVIRONMENT
      project: OneCGIAR QA
      environment-label: DEV
    secrets:
      SLACK_NOTIFICATIONS_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATIONS_WEBHOOK_URL }}

  # ---------------------------------------------------------------- mandatory checks
  # No secret and no AWS access: the legacy server commands need no runtime configuration (no DB, no network).
  server-checks:
    name: server checks (lint, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # pnpm version from package.json "packageManager" through corepack, as the legacy job.
      - name: Install dependencies (lockfile)
        run: corepack pnpm install --frozen-lockfile
      - name: Lint
        run: corepack pnpm lint
      - name: Unit tests
        run: corepack pnpm test --reporter=dot --maxWorkers=2
      - name: e2e tests
        run: corepack pnpm test:e2e --reporter=dot --maxWorkers=2

  # The legacy job writes the frontend configuration before `ng test` (stage 'Generate Frontend Environments'):
  # same here, through OIDC, after the dependencies are installed.
  client-checks:
    name: client checks (tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: qa-dev-ci
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Enforce bound ref
        env:
          BOUND_REF: ${{ vars.CICD_BOUND_REF }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          if [ -z "${BOUND_REF:-}" ] || [ "$CURRENT_REF" != "$BOUND_REF" ]; then echo "::error::ref is not the bound ref (fail closed)"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Dependencies are installed BEFORE the configuration exists: install scripts never see it.
      - name: Install dependencies (lockfile)
        working-directory: client
        run: bash "$GITHUB_WORKSPACE/.github/scripts/without-oidc.sh" npm ci --no-audit --no-fund
      - name: Assume the build role through OIDC (credentials not exported to the job)
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.QA_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.QA_AWS_REGION }}
          role-session-name: qa-dev-ci-${{ github.run_id }}
          mask-aws-account-id: true
          output-env-credentials: false
          output-credentials: true
      - name: Frontend configuration from Secrets Manager
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.QA_AWS_REGION }}
          SECRET_ID: ${{ secrets.QA_FRONTEND_CONFIG_SECRET_ID }}
        run: bash .github/scripts/write-frontend-config.sh
      # The client has no lint step in the legacy job; the production build runs in the image build.
      - name: Unit tests
        working-directory: client
        run: bash "$GITHUB_WORKSPACE/.github/scripts/without-oidc.sh" npx ng test --watch=false
      - name: Remove the frontend configuration and the cache that holds copies of it
        if: always()
        run: bash .github/scripts/remove-frontend-config.sh

  deploy-script-checks:
    name: CI script checks (bash -n, ShellCheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax
        run: |
          for f in .github/scripts/*.sh; do bash -n "$f"; done
      - name: ShellCheck (preinstalled on the runner)
        run: shellcheck --severity=warning .github/scripts/*.sh

  # ---------------------------------------------------------------- common quality barrier + publish
  # Starts only when ALL mandatory checks passed. The three images are built before anything is pushed, so a
  # failed build pushes none. No deploy request here.
  publish-images:
    name: publish images (server, migrate, client)
    needs: [server-checks, client-checks, deploy-script-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: qa-dev-ci
    permissions:
      id-token: write
      contents: read
    outputs:
      backend-digest: ${{ steps.push-backend.outputs.digest }}
      migrate-digest: ${{ steps.push-migrate.outputs.digest }}
      frontend-digest: ${{ steps.push-frontend.outputs.digest }}
    steps:
      - name: Enforce bound ref
        env:
          BOUND_REF: ${{ vars.CICD_BOUND_REF }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          if [ -z "${BOUND_REF:-}" ] || [ "$CURRENT_REF" != "$BOUND_REF" ]; then echo "::error::ref is not the bound ref (fail closed)"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The server images need no configuration (it is injected at run time on the server): they are built BEFORE
      # the frontend configuration exists, with the legacy commands (server/Dockerfile, default target and
      # `--target migrate`).
      - name: Build server API image (legacy `docker build .` in server/)
        env:
          TAG: local/backend:${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .github/scripts/without-oidc.sh docker build --file server/Dockerfile --tag "$TAG" -- server
      - name: Build server migrate image (legacy `docker build --target migrate .` in server/)
        env:
          TAG: local/migrate:${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .github/scripts/without-oidc.sh docker build --file server/Dockerfile --target migrate --tag "$TAG" -- server
      - name: Assume the build role through OIDC (credentials not exported to the job)
        id: aws-config
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.QA_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.QA_AWS_REGION }}
          role-session-name: qa-dev-ci-${{ github.run_id }}
          mask-aws-account-id: true
          output-env-credentials: false
          output-credentials: true
      - name: Frontend configuration from Secrets Manager
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-config.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-config.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-config.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.QA_AWS_REGION }}
          SECRET_ID: ${{ secrets.QA_FRONTEND_CONFIG_SECRET_ID }}
        run: bash .github/scripts/write-frontend-config.sh
      - name: Build client image (legacy `--build-arg NG_CONFIGURATION=test`)
        env:
          TAG: local/frontend:${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .github/scripts/without-oidc.sh docker build --file client/Dockerfile --build-arg NG_CONFIGURATION=test --tag "$TAG" -- client
      - name: Remove the frontend configuration and the cache that holds copies of it
        if: always()
        run: bash .github/scripts/remove-frontend-config.sh
      - name: Assume the build role through OIDC for the push (credentials not exported to the job)
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.QA_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.QA_AWS_REGION }}
          role-session-name: qa-dev-ci-${{ github.run_id }}
          mask-aws-account-id: true
          output-env-credentials: false
          output-credentials: true
      - name: Push server API image and capture its digest
        id: push-backend
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.QA_AWS_REGION }}
          REPOSITORY: ${{ vars.QA_ECR_SERVER_REPOSITORY }}
          LOCAL: local/backend:${{ github.run_id }}-${{ github.run_attempt }}
          TAG: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .github/scripts/push-image.sh
      - name: Push server migrate image and capture its digest
        id: push-migrate
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.QA_AWS_REGION }}
          REPOSITORY: ${{ vars.QA_ECR_SERVER_REPOSITORY }}
          LOCAL: local/migrate:${{ github.run_id }}-${{ github.run_attempt }}
          TAG: migrate-gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .github/scripts/push-image.sh
      - name: Push client image and capture its digest
        id: push-frontend
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.QA_AWS_REGION }}
          REPOSITORY: ${{ vars.QA_ECR_CLIENT_REPOSITORY }}
          LOCAL: local/frontend:${{ github.run_id }}-${{ github.run_attempt }}
          TAG: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .github/scripts/push-image.sh

  # ---------------------------------------------------------------- CD hand-over to Jenkins
  # Only after `publish-images` succeeded with the THREE digests. Jenkins deploys exactly these digests.
  deploy:
    name: deploy (Jenkins qa-application-2026-dev-cd)
    needs: publish-images
    if: >-
      needs.publish-images.result == 'success'
      && needs.publish-images.outputs.backend-digest != ''
      && needs.publish-images.outputs.migrate-digest != ''
      && needs.publish-images.outputs.frontend-digest != ''
    permissions: {}
    uses: ./.github/workflows/jenkins-cd.reusable.yml
    with:
      jenkins-job: qa-application-2026-dev-cd
      environment: qa-dev
      dry-run: false # real deploy (owner decision 2026-11-04); true = validation only
      artifacts: >-
        backend=${{ needs.publish-images.outputs.backend-digest }}
        migrate=${{ needs.publish-images.outputs.migrate-digest }}
        frontend=${{ needs.publish-images.outputs.frontend-digest }}
    secrets:
      JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
      JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}

  # ---------------------------------------------------------------- CI failure notification
  # Only when the run failed before Jenkins started a build (a check, the publish or the hand-over itself).
  # Once Jenkins started the build, Jenkins reports the outcome.
  notify-ci-failure:
    name: notify CI failure (Slack)
    needs: [server-checks, client-checks, deploy-script-checks, publish-images, deploy]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    permissions: {}
    uses: ./.github/workflows/slack-notify.reusable.yml
    with:
      status: failed
      title: OneCGIAR QA NEW ENVIRONMENT
      project: OneCGIAR QA
      environment-label: DEV
      detail: >-
        server-checks=${{ needs.server-checks.result }},
        client-checks=${{ needs.client-checks.result }},
        deploy-script-checks=${{ needs.deploy-script-checks.result }},
        publish-images=${{ needs.publish-images.result }},
        jenkins-hand-over=${{ needs.deploy.result }}
    secrets:
      SLACK_NOTIFICATIONS_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATIONS_WEBHOOK_URL }}
