  ## Project — CGIAR QA Platform (onecgiar_qa)
  New Quality Assurance platform for PRMS, built from scratch (Q4 2026).
  It replaces the current external QA app (qa.cgiar.org), which PRMS Reporting
  Tool only embeds through a bare iframe with no data bridge.

  ## Purpose (initial clarifications, 2026-10-05)
  - QA works per result: results submitted in the PRMS Reporting Tool enter QA,
    and most Reporting Tool fields are shown so each field can be assessed.
  - Current workflow, per result:
    1. Assessor reviews each field (approve, or comment what must change).
    2. Science Program (SP) member accepts or rejects each comment; if accepted,
       the SP corrects the field in the Reporting Tool.
    3. Lead assessor reviews the rejected comments and marks them highlighted.
    4. Third-party broker (TPB) decides on each highlighted field.
    5. PPU applies the agreed correction in the Reporting Tool.
  - Main goal (Jira Discovery NOST-451): the QA coordinator must run the whole
    process without the technical team: open/close phases, create batches and
    mini batches, set timelines, let each program (P/A) advance independently,
    run Round 2 reliably, and receive AI input automatically.

  ## Roles
  QA lead/coordinator, Assessor, Lead assessor, Third-party broker, PPU,
  SP member. The Claude Design mockup has no SP member screen yet (open point).

  ## Stack
  Angular 22 (standalone, signals), Tailwind CSS 4, SSR enabled, Vitest.
  Node 24 LTS.

  ## Open decisions (do not assume an answer in specs)
  - Architecture: QA module embedded in the Reporting Tool vs a platform-agnostic
    QA module reusable by other PRMS tools (ToC, POD, Planning).
  - W3/Bilateral QA for external platforms: run by the PRMS team via API, or by
    each Center.
  - AI input (tags, result category, readiness level, innovation use) is produced
    today outside PRMS; who owns it in the new platform is undecided.
  - Whether a user can hold more than one QA role.
  - Two-way sync: how corrections flow back to the Reporting Tool.
  - Timeline: coordinator target "by December 2026"; QA process starts 2027-01-31.

  ## Sources
  Mockup: Claude Design project "QA Platform" (QA Platform.dc.html).
  Requirements: Jira Discovery NOST-451, NOST-438, NOST-435 (to be prioritized).

