<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" />

<ng-template #navLinks let-items>
  @for (item of items; track item.link) {
    <a
      [routerLink]="item.link"
      routerLinkActive="qa-nav-active"
      [routerLinkActiveOptions]="{ exact: item.exact }"
      [attr.title]="item.label"
      [attr.aria-label]="collapsed() ? item.label : null"
      (click)="mobileNavOpen.set(false)"
      class="relative flex min-h-10 w-full items-center gap-2.5 rounded-lg px-3 text-(length:--fs-14) font-medium text-(--nav-fg-2) no-underline hover:bg-(--nav-2) focus-visible:shadow-(--focus-ring)"
      [class.lg:justify-center]="collapsed()"
      [class.lg:px-0]="collapsed()"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="flex-none" aria-hidden="true"><path [attr.d]="item.icon" /></svg>
      <span [class.lg:sr-only]="collapsed()">{{ item.label }}</span>
    </a>
  }
</ng-template>

@if (mobileNavOpen()) {
  <button
    type="button"
    aria-label="Close menu"
    class="fixed inset-0 z-40 bg-(--overlay) lg:hidden"
    (click)="mobileNavOpen.set(false)"
  ></button>
}

<aside
  id="qa-sidebar"
  aria-label="Main navigation"
  class="fixed inset-y-0 left-0 z-50 flex h-dvh w-[260px] flex-none flex-col border-r border-(--nav-divider) bg-(--nav-bg) transition-[width,translate] duration-200 lg:static lg:translate-x-0"
  [class.-translate-x-full]="!mobileNavOpen()"
  [class.lg:w-16]="collapsed()"
>
  <!-- Stacked logo, 36 px tall, with the collapse button beside it (Juanpa, 2026-11-26: the two-line logo stays big and
       lets the button come back to the sidebar). The button's right edge lines up with the menu items (12 px), which
       leaves more air between it and the logo. Collapsed, the image is clipped so only the PRMS mark shows, with the
       button under it. Room above and below so it does not touch the edge. -->
  <div class="flex items-center gap-2 pt-6 pr-3 pb-5 pl-5" [class.lg:flex-col]="collapsed()" [class.lg:gap-3]="collapsed()" [class.lg:px-0]="collapsed()">
    <span class="flex h-9 min-w-0 flex-1 items-center overflow-hidden" [class.lg:w-11]="collapsed()" [class.lg:flex-none]="collapsed()">
      <img ngSrc="logo-prms-qa.svg" width="176" height="36" priority alt="PRMS quality assurance" class="block h-9 w-auto max-w-none" />
    </span>
    <!-- Collapse / expand the sidebar (desktop). -->
    <button
      type="button"
      class="hidden size-8 flex-none items-center justify-center rounded-lg text-(--nav-fg-3) hover:bg-(--nav-2) lg:flex"
      aria-controls="qa-sidebar"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-expanded]="!collapsed()"
      (click)="toggleMenu()"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" /><path d="M9 3v18" /></svg>
    </button>
    <button
      type="button"
      aria-label="Close menu"
      class="flex size-7 flex-none items-center justify-center rounded-md text-(--nav-fg-3) hover:bg-(--nav-2) lg:hidden"
      (click)="mobileNavOpen.set(false)"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
    </button>
  </div>

  <nav class="flex-1 overflow-y-auto px-3 pt-1 pb-4 [scrollbar-color:var(--border-strong)_transparent] [scrollbar-width:thin]">

    <div class="px-1 py-2 text-(length:--fs-12) font-medium text-(--nav-eyebrow)" [class.lg:sr-only]="collapsed()">Assessment</div>
    <div class="flex flex-col gap-0.5">
      <ng-container *ngTemplateOutlet="navLinks; context: { $implicit: assessment() }" />
    </div>

    @if (administration().length) {
    <div class="mx-1 mt-5 h-px bg-(--nav-divider)"></div>
    <div class="px-1 pt-4 pb-2 text-(length:--fs-12) font-medium text-(--nav-eyebrow)" [class.lg:sr-only]="collapsed()">Administration</div>
    <div class="flex flex-col gap-0.5">
      <ng-container *ngTemplateOutlet="navLinks; context: { $implicit: administration() }" />
    </div>
    }
  </nav>

  <!-- Active cycle at the bottom of the sidebar (Juanpa, 2026-11-25): name and status, the main batch with one bar
       segment per step, and when the step closes (shell/cycle-panel.ts). Information only, not a link (2026-10-29).
       Real data (shell/active-cycle.ts): admins only; nothing while loading or without an active cycle. -->
  @if (activeCycle.card(); as c) {
    <section aria-label="Active cycle" class="flex-none px-3 pt-2 pb-4" [class.lg:hidden]="collapsed()">
      <qa-cycle-panel [card]="c" />
    </section>
  }
</aside>

<div class="flex h-dvh min-w-0 flex-1 flex-col">
  <header class="flex h-14 flex-none items-center gap-2 border-b border-(--border) bg-(--bg) px-3 sm:gap-3 sm:px-5">
    <div class="flex items-center gap-1 sm:flex-none">
      <button
        type="button"
        aria-label="Open menu"
        aria-controls="qa-sidebar"
        [attr.aria-expanded]="mobileNavOpen()"
        class="flex size-8 flex-none items-center justify-center rounded-lg text-(--text-3) hover:bg-(--surface-4) lg:hidden"
        (click)="mobileNavOpen.set(true)"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>
      <button type="button" aria-label="Back" class="hidden size-8 flex-none items-center justify-center rounded-lg text-(--text-3) hover:bg-(--surface-4) sm:flex" (click)="back()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
      </button>
      <button type="button" aria-label="Forward" class="hidden size-8 flex-none items-center justify-center rounded-lg text-(--text-3) hover:bg-(--surface-4) sm:flex" (click)="forward()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7" /></svg>
      </button>
    </div>

    <!-- Search box, the same as PRMS Reporting's top bar (Juanpa's design). Enter opens "Results in QA" searched by
         code or title (`searchResults`, the page's own `?q=`); only for whoever can open that page. -->
    @if (canSearch()) {
      <form role="search" class="hidden min-w-0 flex-1 sm:ml-3 sm:flex" (submit)="searchResults($event, searchBox)">
        <label class="flex h-9 w-full max-w-[520px] items-center gap-2 rounded-lg border border-(--border) bg-(--surface) px-3 text-(--text-3) focus-within:shadow-(--focus-ring)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="flex-none" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input #searchBox type="search" name="q" maxlength="200" enterkeyhint="search" placeholder="Search results by code or title" aria-label="Search results by code or title" class="min-w-0 flex-1 border-0 bg-transparent p-0 text-(length:--fs-14) text-(--text) outline-none placeholder:text-(--text-muted)" />
        </label>
      </form>
      <span class="min-w-0 flex-1 sm:hidden" aria-hidden="true"></span>
    } @else {
      <span class="min-w-0 flex-1" aria-hidden="true"></span>
    }

    <div class="flex items-center justify-end gap-1 sm:flex-none">
      <qa-notifications-bell />
      <qa-unsent-center />
      <!-- A thin line between the top bar's actions and the user menu, as in PRMS (Juanpa, 2026-10-29). Only for admins,
           who have the bell on its left, and from 768 px, where the bell shows its name. -->
      @if (administration().length) {
        <span aria-hidden="true" class="mx-1.5 hidden h-6 w-px flex-none bg-(--border-strong) md:block"></span>
      }
      <div class="relative">
        <button
          type="button"
          aria-haspopup="menu"
          [attr.aria-expanded]="userMenuOpen()"
          class="flex h-9 items-center gap-2 rounded-lg pr-2 pl-1 text-(length:--fs-14) font-medium whitespace-nowrap text-(--text) hover:bg-(--surface-4)"
          (click)="userMenuOpen.set(!userMenuOpen())"
        >
          <span class="flex size-7 flex-none items-center justify-center rounded-full bg-(--tint-2) text-(length:--fs-12) font-semibold text-(--nav-text)" aria-hidden="true">{{ initials() }}</span>
          <span class="hidden md:inline" data-testid="user-email">{{ email() }}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
        </button>
        @if (userMenuOpen()) {
          <button type="button" aria-label="Close user menu" class="fixed inset-0 z-40 cursor-default" (click)="userMenuOpen.set(false)"></button>
          <div role="menu" class="absolute top-[calc(100%+6px)] right-0 z-50 w-60 rounded-lg border border-(--border-raised) bg-(--surface-raised) p-1.5 shadow-(--shadow-pop)">
            <p class="truncate px-2.5 py-2 text-(length:--fs-12) text-(--text-4)">{{ email() }}</p>
            <div class="my-1 h-px bg-(--border-soft)"></div>
            <button type="button" role="menuitem" class="flex h-9 w-full items-center gap-2 rounded-md px-2.5 text-left text-(length:--fs-13) font-medium text-(--text-2) hover:bg-(--surface-4)" (click)="signOut()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" /></svg>
              Sign out
            </button>
          </div>
        }
      </div>
    </div>
  </header>

  <main class="relative min-h-0 flex-1 overflow-y-auto">
    <ng-content />
    <router-outlet />
  </main>
</div>
