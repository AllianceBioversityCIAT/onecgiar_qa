<!-- Overview: the QA admin's dashboard (each block answers one of her questions), or, for the assessor, lead assessor, TPB
     and PPU, "Your work" and a few figures of their own (Juanpa, 2026-11-11). Data: overview.mock.ts, overview-roles.mock.ts. -->

<!-- Page header -->
<div class="flex scroll-mt-6 flex-wrap items-start gap-x-4 gap-y-2 px-4 pt-8 sm:px-6 lg:px-8">
  <!-- At least 320px for the greeting: on phones "Viewing as" wraps under it. -->
  <div class="flex min-w-[min(100%,320px)] flex-[1_1_320px] flex-col gap-1">
    <h1 class="m-0 text-(length:--fs-26) font-bold leading-[1.2] tracking-[-0.02em] text-(--text)">{{ greeting() }}</h1>
    <!-- A warm line that follows the greeting and covers the whole page. No status here: each timeline's status lives in
         "Progress by timeline" and the sidebar's cycle card (Juanpa, 2026-11-11). -->
    <p class="m-0 text-(length:--fs-14) font-normal text-(--text-3)">{{ subtitle() }}</p>
  </div>
  <!-- "Viewing as": design preview of each role's Overview, as in Review (the real role comes from the signed-in user). -->
  <qa-select
    [value]="role()"
    (valueChange)="setRole($event)"
    [options]="roleOptions"
    label="Viewing as"
    appearance="inline"
    panelWidth="240px"
    class="mt-1.5 flex-none"
  />
</div>

@if (role() !== 'admin') {
  <!-- Body of a reviewing role: what needs them first, then where the timelines are, then their own figures. -->
  <div class="flex flex-col items-stretch gap-6 px-4 pt-6 pb-8 sm:px-6 lg:px-8">
    @if (yourWork(); as w) {
      <qa-ov-your-work [data]="w" />
    }
    <div class="grid grid-cols-1 gap-5 xl:grid-cols-12">
      @switch (role()) {
        @case ('assessor') {
          <!-- Will I finish on time? -->
          <qa-ov-pace class="xl:col-span-12" title="Your pace" [series]="myPace()" />
          <!-- Where are my results? · Do the programs take my comments? -->
          <qa-ov-type-progress class="xl:col-span-7" [rows]="myTypes" [query]="myQuery" />
          <qa-ov-split class="xl:col-span-5" [data]="myComments" headingId="overview-comments-title" />
        }
        @case ('lead') {
          <!-- Where do I start? · Where is the guidance unclear? -->
          <qa-ov-ranked class="xl:col-span-6" [data]="leadPrograms" headingId="overview-lead-programs-title" />
          <qa-ov-ranked class="xl:col-span-6" [data]="leadFields" headingId="overview-lead-fields-title" />
        }
        @case ('tpb') {
          <!-- What's next? · How have I decided so far? -->
          <qa-ov-next-items class="xl:col-span-7" [data]="tpbNext" />
          <qa-ov-split class="xl:col-span-5" [data]="tpbDecisions" headingId="overview-decisions-title" />
        }
        @case ('ppu') {
          <qa-ov-next-items class="xl:col-span-12" [data]="ppuNext" />
        }
      }
    </div>
    <!-- Where is each timeline? (no Cycle link: Cycle is an admin screen) -->
    <qa-ov-timeline-lanes [lanes]="lanes()" [cycleLink]="false" (viewStages)="openStages($event)" />
  </div>
} @else {
<!-- Body -->
<div class="flex flex-col items-stretch gap-6 px-4 pt-6 pb-8 sm:px-6 lg:px-8">
  <!-- Filters for the whole page (agreed with María Julia and Ángel, 2026-10-27): every block below counts only what they keep.
       The timeline reads as context ("Viewing All timelines ⌄"), with program and type as menus under it, exactly as in
       Results: same layout, and it scrolls away with the page (docs/ux-ui/design.md § 6, "Filter bar"). -->
  <div class="flex flex-col gap-3">
    <qa-select
      [value]="timeline()"
      (valueChange)="timeline.set($event ?? 'all')"
      [options]="timelineOptions"
      label="Viewing"
      appearance="inline"
      searchable
      searchPlaceholder="Search timelines"
      panelWidth="340px"
      listMaxHeight="320px"
      class="self-start"
    />
    <div class="flex flex-wrap items-center gap-2 lg:gap-3">
      <qa-multi-select [(value)]="programs" [options]="programOptions" label="Science program" [searchable]="false" panelWidth="320px" listMaxHeight="none" />
      <qa-multi-select [(value)]="types" [options]="typeOptions" label="Result type" [searchable]="false" panelWidth="320px" listMaxHeight="none" />
    </div>

    @if (applied().length) {
      <div class="flex flex-wrap items-center gap-2">
        @for (f of applied(); track f.key) {
          <span class="inline-flex h-7 max-w-[min(380px,100%)] items-center gap-1.5 rounded-full bg-(--tint) pr-1.5 pl-2.5 text-(length:--fs-12) font-medium text-(--accent)">
            <span class="flex-none font-semibold">{{ f.label }}</span>
            <span class="min-w-0 truncate">{{ f.values }}</span>
            <button type="button" (click)="clearFilter(f.key)" [attr.aria-label]="'Remove ' + f.label + ' filter'" class="flex size-[18px] flex-none items-center justify-center rounded-full p-0 text-(--accent) outline-none hover:bg-(--tint-3) focus-visible:shadow-(--focus-ring)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" /></svg>
            </button>
          </span>
        }
        <button hlmBtn qaBtn tone="link" size="sm" type="button" (click)="clearAll()">Clear all</button>
      </div>
    }
  </div>

  <!-- Order agreed with María Julia (2026-10-27): timelines, then rounds and statuses, then the analysis of the results. -->
  <!-- Where is each timeline? -->
  <qa-ov-timeline-lanes [lanes]="lanes()" (viewStages)="openStages($event)" />

  <!-- How is the cycle going? -->
  <qa-ov-cycle-hero [data]="hero()" />

  <!-- Two cards per row on wide screens; cards in the same row share height. -->
  <div class="grid grid-cols-1 gap-5 xl:grid-cols-12">
    <!-- Will the open step close on time? -->
    <qa-ov-pace class="xl:col-span-12" [series]="pace()" [assessorOptions]="assessorOptions" [(assessor)]="paceAssessor" />

    <!-- Where are the results? · Is the load balanced? -->
    <qa-ov-type-progress class="xl:col-span-7" [rows]="typeProgress()" [query]="query()" />
    <qa-ov-assessor-load class="xl:col-span-5" [load]="assessorLoad()" [scope]="loadScope()" />
  </div>
</div>
}

<!-- Pop-up -->
<qa-ov-stages [(open)]="stagesOpen" [data]="stagesData()" />
