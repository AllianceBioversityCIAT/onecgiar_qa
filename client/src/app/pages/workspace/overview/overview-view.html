<!-- Overview (QA lead): a dashboard where each block answers one question of the QA admin. Data comes from overview.mock.ts. -->

<!-- Page header -->
<div class="flex scroll-mt-6 flex-wrap items-start gap-4 px-4 pt-8 sm:px-6 lg:px-8">
  <div class="flex min-w-0 flex-1 flex-col gap-1">
    <h1 class="m-0 text-(length:--fs-26) font-bold leading-[1.2] tracking-[-0.02em] text-(--text)">{{ greeting() }}</h1>
    @if (context(); as c) {
      <p class="m-0 text-(length:--fs-14) font-normal text-(--text-3)">{{ c.lead }}<span class="font-semibold text-(--text)">{{ c.key }}</span>{{ c.tail }}</p>
    }
  </div>
</div>

<!-- Body -->
<div class="flex flex-col items-stretch gap-6 px-4 pt-6 pb-8 sm:px-6 lg:px-8">
  <!-- How is the cycle going? -->
  <qa-ov-cycle-hero [data]="hero()" [options]="heroOptions" [timeline]="heroTimeline()" (timelineChange)="heroTimeline.set($event ?? 'all')" />

  <!-- Two cards per row on wide screens; cards in the same row share height. -->
  <div class="grid grid-cols-1 gap-5 xl:grid-cols-12">
    <!-- What do I have to fix? · Will the open step close on time? -->
    <qa-ov-attention class="xl:col-span-5" [groups]="attention()" />
    <qa-ov-pace class="xl:col-span-7" [series]="pace()" />

    <!-- Where is each timeline? -->
    <qa-ov-timeline-lanes class="xl:col-span-12" [lanes]="lanes()" (viewStages)="openStages($event)" />

    <!-- Where are the results? · Is the load balanced? -->
    <qa-ov-type-progress class="xl:col-span-7" [rows]="typeProgress()" />
    <qa-ov-assessor-load class="xl:col-span-5" [load]="assessorLoad" [scope]="loadScope()" />
  </div>
</div>

<!-- Pop-up -->
<qa-ov-stages [(open)]="stagesOpen" [data]="stagesData()" />
