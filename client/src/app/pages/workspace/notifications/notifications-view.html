<!-- Notifications. Data: notifications-store.ts (the one source; mock for now). State lives in notifications-view.ts. -->

<!-- Page header. No "Mark all as read" for now (Juanpa, 2026-10-29): each notification is read when she acts on it. -->
<div class="flex flex-col gap-1 px-4 pt-6 sm:px-6 sm:pt-8 lg:px-8">
  <h1 class="m-0 text-balance text-(length:--fs-26) leading-[1.2] font-bold tracking-[-0.02em] text-(--text)">Notifications</h1>
  <p class="m-0 text-pretty text-(length:--fs-14) text-(--text-3)">Batches ready for the next step, and science programs that need a nudge.</p>
</div>

<!-- One list, newest first, in day groups; each notification carries its own button (Juanpa, 2026-10-29: no tabs, no
     filters, only what María Julia asked for). -->
<div class="px-4 pt-5 pb-8 sm:px-6 lg:px-8">
  <div class="overflow-hidden rounded-xl border border-(--border) bg-(--surface)">
    <qa-notification-list
      [items]="store.items()"
      [state]="store.state()"
      [timelineNames]="timelineNames"
      [batchLabels]="batchLabels"
      (opened)="open($event)"
      (dismissed)="dismiss($event)"
      (retry)="store.retry()"
    />
  </div>
</div>
