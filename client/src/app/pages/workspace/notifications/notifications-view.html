<!-- Notifications. Data: notifications-store.ts (the one source; mock for now). State lives in notifications-view.ts. -->

<!-- Page header. No "Mark all as read" for now (Juanpa, 2026-10-29): each notification is read when she acts on it. -->
<div class="flex flex-col gap-1 px-4 pt-6 sm:px-6 sm:pt-8 lg:px-8">
  <h1 class="m-0 text-balance text-(length:--fs-26) leading-[1.2] font-bold tracking-[-0.02em] text-(--text)">Notifications</h1>
  <p class="m-0 text-pretty text-(length:--fs-14) text-(--text-3)">Batches ready for the next step, and science programs that need a nudge.</p>
</div>

<!-- The list is the design prototype (notifications.mock.ts): it does not read the API yet. Said before the first
     notification so nobody reads them as real (same notice as Overview, P2-4079). Remove this block in the change that
     sets `NotificationsStore.sample` to false. -->
@if (store.sample) {
  <div class="px-4 pt-4 sm:px-6 lg:px-8">
    <p role="note" data-testid="notifications-sample-data"
       class="m-0 flex flex-wrap items-center gap-x-2 gap-y-0.5 rounded-lg border border-warning-ink/25 bg-warning-soft px-3 py-2 text-(length:--fs-13) leading-[1.5] text-warning-ink">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="flex-none"><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 7.5v.5" /></svg>
      <span class="font-semibold">Preview · sample data</span>
      <span>These notifications are examples from the design prototype, not real QA activity.</span>
    </p>
  </div>
}

<!-- One list, newest first, in day groups; each notification carries its own button (Juanpa, 2026-10-29: no tabs, no
     filters, only what María Julia asked for). -->
<div class="px-4 pt-5 pb-8 sm:px-6 lg:px-8">
  <div class="overflow-hidden rounded-xl border border-(--border) bg-(--surface) shadow-(--shadow-card)">
    <qa-notification-list
      [items]="store.items()"
      [state]="store.state()"
      [timelineNames]="timelineNames"
      [batchLabels]="batchLabels"
      (opened)="open($event)"
      (dismissed)="dismiss($event)"
      (retry)="store.retry()"
    />
  </div>
</div>
